[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knocknock"
version = "1.2.0"
description = "Select text or grab a screenshot anywhere on screen and ask a large language model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["screenshot", "ocr", "llm", "openai", "desktop", "pyside6", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "PySide6-Essentials>=6.6.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Ada-Junk/Knocknock"
Source = "https://github.com/Ada-Junk/Knocknock"

[tool.setuptools]
packages = ["knocknock"]

[tool.setuptools.package-data]
knocknock = ["py.typed"]
